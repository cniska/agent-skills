name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        uses: jdx/mise-action@v2

      - name: Validate skills
        run: mise run validate

      - name: Lint bash
        run: mise run lint

      - name: Test bash
        run: mise run test
