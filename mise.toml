# Install mise with `brew install mise`, then `mise install`.

[tools]
shellcheck = "0.11.0"
bun = "1.4.2"
jq = "1.8.1"

[hooks]
postinstall = "bun install --frozen-lockfile >&2"

[tasks.validate]
description = "Validate skill format and conventions"
run = "bun scripts/validate.ts"

[tasks.test]
description = "Run the bash and TypeScript tests (offline, no API)"
run = 'bun run test && for t in $(find . -name "*.test.sh" -not -path "./node_modules/*" -not -path "./.claude/*" | sort); do echo "== $t =="; bash "$t" || exit 1; done'

[tasks.lint]
description = "Shellcheck shell scripts, then lint and typecheck the TypeScript"
run = 'bun run lint && bun run typecheck && shellcheck -x --source-path=SCRIPTDIR $(find . -name "*.sh" -not -path "./node_modules/*" -not -path "./.claude/*")'

[tasks.bootstrap]
description = "Install dependencies, which wire the commit hooks, and run validation"
run = "./scripts/bootstrap.sh"

[tasks.new-skill]
description = "Create a new skill"
usage = '''
arg "<name>" help="kebab-case skill name"
arg "<description>" help="imperative description starting with a verb"
'''
run = './scripts/new-skill.sh "$usage_name" "$usage_description"'

[tasks.link]
description = "Symlink skills into ~/.agents/skills (all, or the named ones)"
usage = 'arg "[name]" var=#true help="skills to link; none links every skill"'
run = "./scripts/link.sh $usage_name"

[tasks.eval]
description = "Run the skill evals, optionally against a base ref or none, then summarize (uses your login; local only, never CI)"
run = "evals/lib/run.sh"

[tasks."eval:prove"]
description = "Grade saved eval traces with a case's graders, without calling the model"
run = "bun evals/lib/prove.ts"

[tasks."eval:summary"]
description = "Summarize an eval run: scores per case and arm, and the graders that failed"
run = "bun evals/lib/summary.ts"

[tasks."eval:keep"]
description = "Copy a kept run's trace into the case's traces/ folder"
run = "bun evals/lib/keep-trace.ts"

[tasks."test:evals"]
description = "Check every eval case's graders against its saved traces (no model)"
run = "bun evals/lib/test-graders.ts"

[tasks."test:triggers"]
description = "Check each skill's description ranks first for the prompts that should load it (no model)"
run = "bun evals/lib/triggers.ts"
